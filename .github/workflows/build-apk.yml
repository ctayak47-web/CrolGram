name: Build CrolGram APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI: arm64-v8a,armeabi-v7a (по умолчанию, подходит 64- и 32-битным телефонам), arm64-v8a (быстрее), all (все 4 ABI)"
        default: "arm64-v8a,armeabi-v7a"
        required: false
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "branding/**"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    env:
      ABI: ${{ github.event.inputs.abi || 'arm64-v8a,armeabi-v7a' }}
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,time_macros
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Inject Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            case "$TG_API_ID" in (*[!0-9]*) echo "::error::TG_API_ID must be numeric"; exit 1;; esac
            case "$TG_API_HASH" in (*[!0-9a-fA-F]*) echo "::error::TG_API_HASH must be hex"; exit 1;; esac
            sed -i -E "s/(public static int APP_ID = )[0-9]+;/\\1${TG_API_ID};/" "$F"
            sed -i -E "s/(public static String APP_HASH = \")[0-9a-fA-F]+(\";)/\\1${TG_API_HASH}\\2/" "$F"
            if grep -q "APP_ID = ${TG_API_ID};" "$F"; then echo "::notice title=api::custom api_id injected"; else echo "::error::APP_ID injection failed"; exit 1; fi
          else
            echo "::warning title=api::TG_API_ID/TG_API_HASH not set, building with public APP_ID=4 (login may fail)"
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ccache -z
          EXTRA="-PcrolCcache=1"
          if [ -n "$ABI" ] && [ "$ABI" != "all" ]; then EXTRA="$EXTRA -PcrolAbis=$ABI"; fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease $EXTRA --stacktrace
          echo "::notice title=ccache::$(ccache -s | tr '\n' ' ' | head -c 400)"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify, re-sign if needed, collect APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/36.0.0"
          echo "Candidates:"; find . -name '*.apk' -path '*afat/release*' -not -path './.git/*' -printf '%p %s bytes\n'
          # берём именно готовый APK из build/outputs, а не промежуточный из build/intermediates
          APK=$(find . -name '*.apk' -path '*outputs/apk/afat/release*' -not -path './.git/*' | head -1)
          if [ -z "$APK" ]; then APK=$(find . -name app.apk -path '*afat/release*' -not -path './.git/*' | head -1); fi
          echo "APK: $APK"
          mkdir -p dist
          cp "$APK" dist/CrolGram.apk
          NEED_SIGN=0
          if ! "$BT/zipalign" -c -P 16 4 dist/CrolGram.apk; then echo "::warning title=zipalign::APK not aligned, will re-align"; NEED_SIGN=1; fi
          if "$BT/apksigner" verify --verbose --print-certs dist/CrolGram.apk > /tmp/verify.txt 2>&1; then
            echo "::notice title=apksigner::VERIFIED $(grep -E 'Verified using|Number of signers' /tmp/verify.txt | tr '\n' ' ')"
            if ! grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt; then NEED_SIGN=1; fi
          else
            echo "::warning title=apksigner::FAILED $(tr '\n' ' ' < /tmp/verify.txt | head -c 400) -> re-signing"
            NEED_SIGN=1
          fi
          if [ "$NEED_SIGN" = "1" ]; then
            keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$BT/zipalign" -f -p 4 dist/CrolGram.apk dist/aligned.apk
            "$BT/apksigner" sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true dist/aligned.apk
            mv dist/aligned.apk dist/CrolGram.apk
            "$BT/apksigner" verify --verbose dist/CrolGram.apk
          fi
          "$BT/aapt2" dump badging dist/CrolGram.apk > /tmp/badging.txt 2>&1 || true
          echo "::notice title=badging::$(grep -E "^package|sdkVersion|targetSdk|native-code|application-label:" /tmp/badging.txt | tr '\n' ' ' | head -c 700)"
          unzip -l dist/CrolGram.apk | grep -E "lib/.*libtmessages|classes[0-9]*\.dex|AndroidManifest" | awk '{print $4" "$1}' | tr '\n' ' ' | head -c 600 | sed 's/^/::notice title=contents::/'
          ls -la dist

      - name: Make arm64-only APK and check integrity
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/36.0.0"
          # универсальный APK: целостность архива
          unzip -tq dist/CrolGram.apk
          # лёгкая версия только для 64-битных телефонов (меньше размер, надёжнее скачивание)
          cp dist/CrolGram.apk dist/CrolGram-arm64.apk
          if unzip -l dist/CrolGram-arm64.apk | grep -q "lib/armeabi-v7a/"; then
            zip -q -d dist/CrolGram-arm64.apk 'lib/armeabi-v7a/*' 'lib/x86/*' 'lib/x86_64/*' || true
          fi
          "$BT/zipalign" -f -p 4 dist/CrolGram-arm64.apk dist/arm64-aligned.apk
          "$BT/apksigner" sign --ks TMessagesProj/config/release.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androidkey \
            --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true dist/arm64-aligned.apk
          mv dist/arm64-aligned.apk dist/CrolGram-arm64.apk
          rm -f dist/arm64-aligned.apk.idsig dist/CrolGram-arm64.apk.idsig
          "$BT/apksigner" verify --verbose dist/CrolGram-arm64.apk | head -8
          unzip -tq dist/CrolGram-arm64.apk
          "$BT/aapt2" dump badging dist/CrolGram-arm64.apk | grep -E "^package|native-code" | tr '\n' ' ' | sed 's/^/::notice title=arm64::/'
          sha256sum dist/*.apk | tee dist/SHA256.txt
          ls -la dist

      - name: Publish APK to GitHub Release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          S1=$(sha256sum dist/CrolGram.apk | cut -d' ' -f1)
          S2=$(sha256sum dist/CrolGram-arm64.apk | cut -d' ' -f1)
          gh release create latest dist/CrolGram-arm64.apk dist/CrolGram.apk \
            --title "CrolGram (сборка #${{ github.run_number }})" \
            --notes "Прямой APK (не zip). Для большинства телефонов: CrolGram-arm64.apk (меньше размер). CrolGram.apk подходит и 32-битным. Если выдаёт «не удалось обработать пакет»: скачайте заново (сверьте размер) и удалите старую CrolGram, если она подписана другим ключом. Коммит ${GITHUB_SHA::7}, сборка #${{ github.run_number }}. SHA-256 arm64: ${S2}. SHA-256 universal: ${S1}." \
            --prerelease --target "$GITHUB_SHA"
          echo "::notice title=release::https://github.com/${{ github.repository }}/releases/tag/latest"

      - uses: actions/upload-artifact@v4
        with:
          name: CrolGram-apk
          path: |
            dist/CrolGram.apk
            dist/CrolGram-arm64.apk
          if-no-files-found: error
