name: Build CrolGram APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI (пусто = обычная сборка всех ABI; arm64-v8a = быстрая, но может не ставиться)"
        default: ""
        required: false
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "branding/**"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1); fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build release APK
        env:
          ABI: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.abi || '' }}
        run: |
          chmod +x ./gradlew
          EXTRA=""
          if [ -n "$ABI" ]; then EXTRA="-Pandroid.injected.build.abi=$ABI"; fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease $EXTRA --stacktrace

      - name: Verify, re-sign if needed, collect APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/36.0.0"
          APK=$(find . -name app.apk -path '*afat/release*' -not -path './.git/*' | head -1)
          echo "APK: $APK"
          mkdir -p dist
          cp "$APK" dist/CrolGram.apk
          unzip -tq dist/CrolGram.apk > /tmp/unzip.txt 2>&1 || true
          echo "::notice title=zip test::$(tail -1 /tmp/unzip.txt)"
          if "$BT/apksigner" verify --verbose dist/CrolGram.apk > /tmp/verify.txt 2>&1; then
            echo "::notice title=apksigner::VERIFIED $(tr '\n' ' ' < /tmp/verify.txt | head -c 300)"
          else
            echo "::warning title=apksigner::FAILED $(tr '\n' ' ' < /tmp/verify.txt | head -c 400) -> re-signing"
            keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$BT/zipalign" -f -p 4 dist/CrolGram.apk dist/aligned.apk
            "$BT/apksigner" sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android dist/aligned.apk
            mv dist/aligned.apk dist/CrolGram.apk
            "$BT/apksigner" verify --verbose dist/CrolGram.apk | head -5
          fi
          "$BT/aapt2" dump badging dist/CrolGram.apk > /tmp/badging.txt 2>&1 || true
          echo "::notice title=badging::$(grep -E "^package|sdkVersion|targetSdkVersion|native-code" /tmp/badging.txt | tr '\n' ' ' | head -c 600)"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CrolGram-apk
          path: dist/CrolGram.apk
          if-no-files-found: error
