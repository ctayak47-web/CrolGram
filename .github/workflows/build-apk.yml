name: Build CrolGram APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI для сборки (arm64-v8a быстрее всего; пусто = все 4 ABI)"
        default: "arm64-v8a"
        required: false
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "branding/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1); fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        env:
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
        run: |
          chmod +x ./gradlew
          EXTRA=""
          if [ -n "$ABI" ]; then EXTRA="-Pandroid.injected.build.abi=$ABI"; fi
          ./gradlew :TMessagesProj_App:assembleAfatDebug $EXTRA --stacktrace

      - name: List built APKs
        if: always()
        run: |
          echo "::notice title=APK files::$(find . -name '*.apk' -not -path './.git/*' 2>/dev/null | head -20 | tr '\n' ' ')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrolGram-debug-apk
          path: |
            **/build/intermediates/apk/**/*.apk
            **/build/outputs/**/*.apk
          if-no-files-found: error
